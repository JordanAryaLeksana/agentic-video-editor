[project]
name = "agentic-video-editor"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "JordanAryaLeksana", email = "jordanaryaleksana41@gmail.com" }
]
requires-python = ">=3.12"
dependencies = [
    "aiosqlite>=0.22.1",
    "fastapi>=0.143.0",
    "httpx2>=2.13.1",
    "opencv-python>=5.0.0.93",
    "pydantic>=2.14.1",
    "pydantic-settings>=2.15.0",
    "python-multipart>=0.0.32",
    "scenedetect>=0.7.1",
    "sqlalchemy>=2.1.4",
    "uvicorn[standard]>=0.54.0",
]

[project.scripts]
agentic-video-editor = "agentic_video_editor:main"

[build-system]
requires = ["uv_build>=0.13.0,<0.14.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.0",
    "ruff>=0.17.0",
]
